<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hip-Hop | 1980–2000</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    :root {
      --bg: #090b13;
      --card: #151a29;
      --line: #30374c;
      --gold: #ffd45a;
      --muted: #b9c0d1;
    }

    body {
      background:
        radial-gradient(circle at 80% 5%, #31204b, transparent 38%),
        var(--bg);
      color: #f8f7f2;
      font-family: system-ui, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--line);
    }

    .gold {
      color: var(--gold);
    }

    .muted,
    .hint {
      color: var(--muted);
    }

    .hint {
      font-size: 13px;
      line-height: 1.5;
    }

    .stage,
    .playlist {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
    }

    .screen {
      position: relative;
      background: #05070c;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .screen video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    .screen video[hidden],
    .overlay[hidden],
    .placeholder[hidden] {
      display: none;
    }

    .placeholder {
      text-align: center;
      padding: 20px;
    }

    .placeholder h1 {
      font-size: clamp(23px, 4vw, 56px);
      margin: 5px 0;
      font-weight: 800;
    }

    .placeholder p {
      color: #ded5ff;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 45px 25px 17px;
      background: linear-gradient(transparent,
          rgba(0, 0, 0, .9));
      pointer-events: none;
    }

    .overlay h2 {
      font-size: clamp(20px, 3vw, 48px);
      margin: 3px 0;
      font-weight: 800;
    }

    .overlay p {
      font-size: clamp(15px, 1.7vw, 27px);
      margin: 0;
    }

    .note {
      padding: 18px 20px;
      background: #111827;
      border-top: 1px solid var(--line);
    }

    .note small {
      color: var(--gold);
      font-weight: 700;
      letter-spacing: .06em;
    }

    .listening-toggle {
      color: var(--gold);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .06em;
      cursor: pointer;
      user-select: none;
    }

    .listening-toggle:hover {
      color: #ffe28a;
    }

    .note p {
      margin: 7px 0 0;
      line-height: 1.5;
      font-size: clamp(14px, 1.1vw, 18px);
    }

    .meter {
      padding: 15px 18px;
    }

    .meterline {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 9px;
    }

    .progress {
      height: 8px;
      background: #343c50;
    }

    .progress-bar {
      background: var(--gold);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      padding: 0 18px 18px;
    }

    .controls .btn {
      padding: 11px 15px;
      border-radius: 8px;
      font-weight: 600;
    }

    .btn-gold {
      background: var(--gold);
      color: #171318;
      border: none;
    }

    .btn-gold:hover {
      background: #ffe28a;
      color: #171318;
    }

    .btn-darkish {
      background: #272d3e;
      color: white;
      border: 1px solid #4a5165;
    }

    .btn-darkish:hover {
      background: #3a435b;
      color: white;
    }

    .playlist {
      padding: 16px;
    }

    .playlist h3 {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .track {
      width: 100%;
      text-align: left;
      padding: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: white;
      border-radius: 8px;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .track:hover {
      background: #292d3d;
    }

    .track.active {
      border-color: var(--gold);
      background: #383321;
    }

    .track small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    .setup {
      padding: 22px 0;
    }

    .form-control,
    .form-select {
      background-color: #252c3e;
      border-color: #596075;
      color: white;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: #252c3e;
      color: white;
      border-color: var(--gold);
      box-shadow: 0 0 0 .2rem rgba(255, 212, 90, .15);
    }

    .form-select option {
      color: white;
      background: #252c3e;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
      margin: 12px 0;
    }

    .mapping {
      display: grid;
      gap: 10px;
    }

    .maprow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .maprow label {
      font-size: 13px;
    }

    @media (min-width: 1920px) {
      .container-fluid {
        max-width: 1920px;
      }

      .controls .btn {
        font-size: 1.1rem;
      }
    }

    @media (max-width: 767.98px) {
      .controls .btn {
        flex: 1 1 42%;
        font-size: 13px;
      }

      .controls #play {
        flex-basis: 100%;
      }

      .maprow {
        grid-template-columns: 1fr;
      }

      .overlay {
        padding: 30px 12px 10px;
      }

      .note {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="py-3 px-4">
    <div class="d-flex flex-wrap justify-content-between gap-2">
      <strong class="gold">HIP-HOP / 1980—2000</strong>
      <span class="muted">
        UFBA · Estudos Especiais · Prof. Dr. Hugo Ribeiro
      </span>
    </div>
  </header>

  <div class="container-fluid px-3 px-lg-4 py-4">
    <div class="row g-4">

      <main class="col-12 col-xl-9">

        <div class="stage">

          <div class="screen">
            <video id="player" playsinline preload="metadata" hidden>
            </video>

            <div class="placeholder" id="placeholder">
              <div class="gold fw-bold" id="phYear">1980</div>
              <h1 id="phArtist">Kurtis Blow</h1>
              <p id="phSong">The Breaks</p>
            </div>

            <div class="overlay" id="overlay" hidden>
              <strong class="gold" id="year"></strong>
              <h2 id="artist"></h2>
              <p id="song"></p>
            </div>
          </div>

          <details class="note" id="listeningDetails">
            <summary class="listening-toggle">NA ESCUTA</summary>
            <p id="guide"></p>
          </details>

          <div class="meter">
            <div class="meterline">
              <span id="counter">01 / 10</span>
              <span id="clock">00:00 / 05:00</span>
            </div>

            <div class="progress">
              <div class="progress-bar" id="fill" style="width:0%">
              </div>
            </div>
          </div>

          <div class="controls">
            <button id="play" class="btn btn-gold">
              ▶ Reproduzir montagem
            </button>

            <button id="pause" class="btn btn-darkish">
              ⏸ Pausar
            </button>

            <button id="prev" class="btn btn-darkish">
              ← Anterior
            </button>

            <button id="next" class="btn btn-darkish">
              Próximo →
            </button>

            <button id="restart" class="btn btn-darkish">
              ↺ Reiniciar
            </button>
          </div>

        </div>

        <section class="setup">
          <p class="status" id="status" role="status">
            Vídeos hospedados no GitHub Pages. Clique em Reproduzir montagem.
          </p>
        </section>

      </main>

      <aside class="col-12 col-xl-3">
        <div class="playlist">
          <h3 class="h5">10 gravações</h3>
          <div id="list"></div>
        </div>
      </aside>

    </div>
  </div>

  <script>

    const tracks = [
      [
        1980,
        'Kurtis Blow',
        'The Breaks',
        45, 75,
        'O baixo e a bateria mantêm um groove próximo ao funk e à disco music. Guarde essa sonoridade para comparar com as bases eletrônicas e os samples dos anos seguintes.'
      ],
      [
        1982,
        'Afrika Bambaataa & The Soulsonic Force',
        'Planet Rock',
        35, 65,
        'Em The Breaks, o acompanhamento lembra uma banda de funk. Aqui, bateria eletrônica e sintetizadores assumem o centro da música, com timbres mais artificiais e futuristas.'
      ],
      [
        1983,
        'Run-D.M.C.',
        "Sucker M.C.'s",
        20, 50,
        'Planet Rock explora vários timbres eletrônicos. Sucker M.C.’s faz quase o contrário: reduz a base a uma batida seca e deixa a voz muito mais exposta.'
      ],
      [
        1986,
        'Eric B. & Rakim',
        'Eric B. Is President',
        40, 70,
        'Em Sucker M.C.’s, as frases vocais têm acentos mais diretos. Rakim trabalha com pausas e divisões rítmicas mais variadas, fazendo a voz circular de outra maneira sobre a batida.'
      ],
      [
        1988,
        'Public Enemy',
        'Rebel Without a Pause',
        30, 60,
        'A base enxuta de Sucker M.C.’s dá lugar a uma sobreposição intensa de samples, ruídos e percussões. Comparada à gravação de Rakim, a voz agora disputa espaço com uma produção muito mais carregada.'
      ],
      [
        1989,
        'De La Soul',
        'Me Myself and I',
        40, 70,
        'Public Enemy utiliza samples para criar tensão. De La Soul também trabalha com trechos de outras gravações, mas recupera um balanço mais dançante, próximo ao funk que ouvimos em The Breaks.'
      ],
      [
        1992,
        'Dr. Dre feat. Snoop Dogg',
        "Nuthin' but a 'G' Thang",
        50, 80,
        'Em De La Soul, o groove tem um caráter mais brincalhão. No G-funk de Dr. Dre, baixo e teclados criam uma base mais suave, enquanto Snoop usa um flow relaxado, bem diferente da intensidade de Public Enemy.'
      ],
      [
        1993,
        'Wu-Tang Clan',
        'C.R.E.A.M.',
        30, 60,
        'O contraste com Nuthin’ but a G Thang é marcante: saem os teclados suaves do G-funk e entra um piano repetitivo, com uma sonoridade mais crua. A atmosfera também lembra a tensão de Public Enemy, mas com menos camadas sonoras.'
      ],
      [
        1998,
        'OutKast',
        'Rosa Parks',
        45, 75,
        'Depois da atmosfera contida de C.R.E.A.M., Rosa Parks traz outro tipo de balanço, com uma combinação mais variada de timbres e referências. A gravação mostra como o hip-hop também se desenvolveu fora dos modelos de Nova York e da Costa Oeste.'
      ],
      [
        1999,
        'Dr. Dre feat. Snoop Dogg',
        'Still D.R.E.',
        20, 50,
        'O piano repetido lembra o uso de loops em C.R.E.A.M., mas aqui o som é mais limpo e definido. Comparando com Nuthin’ but a G Thang, de 1992, percebemos a continuidade do estilo de Dr. Dre e uma produção ainda mais precisa.'
      ]
    ];

    // Os arquivos devem estar na pasta videos do repositório.
    // Use estes nomes exatos, incluindo letras minúsculas.
    const urls = [
      'videos/01-the-breaks.mp4',
      'videos/02-planet-rock.mp4',
      'videos/03-sucker-mcs.mp4',
      'videos/04-eric-b-is-president.mp4',
      'videos/05-rebel-without-a-pause.mp4',
      'videos/06-me-myself-and-i.mp4',
      'videos/07-nuthin-g-thang.mp4',
      'videos/08-cream.mp4',
      'videos/09-rosa-parks.mp4',
      'videos/10-still-dre.mp4'
    ];

    const $ = id => document.getElementById(id);
    const video = $('player');

    let current = 0;
    let playing = false;
    let token = 0;

    function fmt(n) {
      n = Math.max(0, Math.floor(n));

      return String(Math.floor(n / 60)).padStart(2, '0') +
        ':' +
        String(n % 60).padStart(2, '0');
    }

    function updateProgress(within) {
      const elapsed =
        current * 30 +
        Math.max(0, Math.min(30, within));

      $('clock').textContent =
        fmt(elapsed) + ' / 05:00';

      $('fill').style.width =
        (elapsed / 300 * 100) + '%';
    }

    function draw() {
      $('listeningDetails').open = false;
      const t = tracks[current];

      $('phYear').textContent =
        $('year').textContent = t[0];

      $('phArtist').textContent =
        $('artist').textContent = t[1];

      $('phSong').textContent =
        $('song').textContent = t[2];

      $('guide').textContent = t[5];

      $('counter').textContent =
        String(current + 1).padStart(2, '0') +
        ' / 10';

      updateProgress(0);

      const list = $('list');
      list.replaceChildren();

      tracks.forEach((x, i) => {
        const b = document.createElement('button');

        b.className =
          'track' + (i === current ? ' active' : '');

        const strong = document.createElement('strong');
        strong.className = 'gold';
        strong.textContent = x[0] + ' · ';

        b.append(
          strong,
          document.createTextNode(x[1])
        );

        const small = document.createElement('small');
        small.textContent = x[2];

        b.append(small);

        b.onclick = () => jump(i);
        list.append(b);
      });
    }

    function load(autoplay = false) {
      const myToken = ++token;

      video.pause();
      video.removeAttribute('src');
      video.load();

      draw();

      if (!urls[current]) {
        video.hidden = true;
        $('placeholder').hidden = false;
        $('overlay').hidden = true;

        if (autoplay) {
          playing = false;
          $('status').textContent =
            'Falta associar o vídeo de ' +
            tracks[current][1];
        }

        return;
      }

      video.hidden = false;
      $('placeholder').hidden = true;
      $('overlay').hidden = false;

      video.src = urls[current];

      video.onerror = () => {
        playing = false;
        $('status').textContent =
          'Não foi possível carregar ' + urls[current] +
          '. Confira o nome do arquivo no GitHub.';
      };

      video.onloadedmetadata = () => {
        if (myToken !== token) return;

        const start = tracks[current][3];
        const end = tracks[current][4];

        if (video.duration < end - .2) {
          $('status').textContent =
            'Atenção: este arquivo é mais curto que o trecho escolhido.';
        }

        video.currentTime = Math.min(
          start,
          Math.max(0, video.duration - .1)
        );
      };

      video.onseeked = () => {
        if (
          myToken !== token ||
          !autoplay ||
          !playing
        ) return;

        video.play().catch(() => {
          $('status').textContent =
            'O navegador bloqueou a reprodução. Clique em Reproduzir novamente.';
        });
      };

      video.load();
    }

    function advance() {
      if (current < 9) {
        current++;
        load(true);
      } else {
        playing = false;
        video.pause();
        updateProgress(30);

        $('status').textContent =
          'Montagem concluída.';
      }
    }

    function jump(i) {
      current = Math.max(0, Math.min(9, i));
      load(playing);
    }

    video.addEventListener('timeupdate', () => {
      if (!playing) return;

      const t = tracks[current];

      updateProgress(
        video.currentTime - t[3]
      );

      if (video.currentTime >= t[4] - .08) {
        advance();
      }
    });

    video.addEventListener('ended', () => {
      if (playing) advance();
    });

    $('play').onclick = () => {
      if (
        current === 9 &&
        video.currentTime >= tracks[9][4] - .1
      ) {
        current = 0;
        load(false);
      }

      playing = true;

      if (!video.src || video.hidden) {
        load(true);
      } else if (video.readyState < 1) {
        load(true);
      } else if (
        video.currentTime < tracks[current][3] - .5 ||
        video.currentTime >= tracks[current][4]
      ) {
        load(true);
      } else {
        video.play().catch(() => {
          $('status').textContent =
            'Não foi possível reproduzir. Confira o formato MP4.';
        });
      }
    };

    $('pause').onclick = () => {
      playing = false;
      video.pause();
    };

    $('prev').onclick = () => jump(current - 1);
    $('next').onclick = () => jump(current + 1);

    $('restart').onclick = () => {
      playing = false;
      current = 0;
      load(false);
    };

    draw();
    load(false);
  </script>

  <!-- O layout utiliza apenas o CSS do Bootstrap. -->

</body>

</html>
